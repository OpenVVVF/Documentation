# OpenVVVF product-line registry.
#
# This file maps physical hardware directories to product-line identifiers
# so the BOM manager and documentation tools can support multiple power
# stages and application profiles from one shared control module.

product_line: openvvvf

# Roots to scan for physical hardware designs. Paths are relative to the
# repository root (where this file lives).
hardware_roots:
  - ../InverterGen5/Hardware

# Reusable control module documented in Docs/Platform/.
control_module:
  id: openvvvf-control-module
  short_code: OVCM
  name: OpenVVVF Control Module

# Power stages / chassis variants. Keys are directory basenames under the
# hardware roots. 'short_code' is used in internal part numbers.
chassis:
  Chassis2:
    id: chassis-size-2
    short_code: C2
    name: Chassis Size 2
    description: 150/200/400 V class per DC-link capacitor selection / 465 A continuous, 600 A peak (60 s)
  Chassis3:
    id: chassis-size-3
    short_code: C3
    name: Chassis Size 3
    description: Up to 1200 V / 1400 A (in development)

# Release families: product lines released from another chassis's hardware
# tree. A tag named <family>-<rev> (e.g. C2-DCDC-A) scopes the chassis-level
# export to the listed chassis tree and publishes it under the family's own
# short code: Data/Releases/<family>/<rev>/ with a CHASSIS-<family>-<rev>
# manifest entry. Boards inside still use the chassis short code, so shared
# hardware keeps its existing part numbers (e.g. HW-C2-PCB-CTRL-A).
release_families:
  C2-DCDC:
    chassis: Chassis2
    name: Chassis Size 2 with DC/DC Module
    description: C2 power stage plus 15 kW DC/DC converter module (Mechanical/DC-DC-Module.FCStd)

# Application profiles documented in Docs/Safety-and-Compliance/HARA/Application-Profiles/.
application_profiles:
  motorcycle:
    id: application-profile-motorcycle
    name: Motorcycle
    standard: ISO 26262:2018
  passenger-car:
    id: application-profile-passenger-car
    name: Passenger Car
    standard: ISO 26262:2018
  industrial:
    id: application-profile-industrial
    name: Industrial Drive
    standard: IEC 61800-5-2
  rail:
    id: application-profile-rail
    name: Rail
    standard: EN 50126/50128/50129
