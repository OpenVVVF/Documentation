<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Part Viewer - OpenVVVF</title>
<link rel="icon" type="image/svg+xml" href="../../brand/icon.svg">
<style>
@font-face { font-family: "Saira"; src: url("../../brand/fonts/Saira-400.ttf") format("truetype"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Saira"; src: url("../../brand/fonts/Saira-700.ttf") format("truetype"); font-weight: 700; font-display: swap; }
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 20px;
  border-bottom: 1px solid #e9ecef; background: #fff; flex-wrap: wrap; }
header img { height: 28px; }
header h1 { font-family: "Saira", sans-serif; font-size: 18px; margin: 0; }
header h1 .sep { color: #5a5a5a; font-weight: 400; margin: 0 6px; }
header .pn { color: #5a5a5a; font-size: 14px; }
#toolbar { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; }
#toolbar button {
  font: 13px/1 inherit; padding: 6px 10px; border: 1px solid #dee2e6; border-radius: 4px;
  background: #fff; color: #343a40; cursor: pointer; }
#toolbar button:hover { background: #f1f3f5; }
#toolbar button.active { background: #1a5f9e; border-color: #1a5f9e; color: #fff; }
#viewer { width: 100vw; height: calc(100vh - 54px); }
#err { padding: 40px; color: #c41e3a; display: none; }
</style>
</head>
<body>
<header>
  <a href="../../index.html"><img src="../../brand/logo.png" alt="OpenVVVF"></a>
  <h1><span class="sep">/</span>3D Part Viewer</h1>
  <span class="pn" id="pn"></span>
  <div id="toolbar">
    <button id="btnEdges" title="Toggle feature-edge display">Edges</button>
    <button id="btnReset" title="Reset view (fit model to window)">Reset</button>
  </div>
</header>
<div id="viewer"></div>
<div id="err"></div>
<!-- Vendored Online3DViewer 0.18.0 engine (MIT, see o3dv/LICENSE.md).
     No runtime CDN dependency for STL/OBJ/3MF/glTF; STEP/IFC/3dm/draco imports
     would fetch their wasm decoders from jsdelivr on demand, which we never use here. -->
<script src="o3dv/o3dv.min.js"></script>
<script>
const params = new URLSearchParams(location.search);
// Contract: ?file=<path> (single model, as generated by HWRelease viewer.py)
// or ?files=<a,b,c> (multiple models, for future assembly views).
// Paths are relative URLs from this page.
let files = [];
const multi = params.get("files");
if (multi) {
  files = multi.split(",").map(s => s.trim()).filter(s => s);
} else if (params.get("file")) {
  files = [params.get("file")];
}
document.getElementById("pn").textContent = files.length
  ? files.map(f => f.split("/").pop().replace(/\.[a-z0-9]+$/i, "")).join(" + ") : "";

const viewerDiv = document.getElementById("viewer");
const errDiv = document.getElementById("err");
const btnEdges = document.getElementById("btnEdges");
const btnReset = document.getElementById("btnReset");

if (!files.length) {
  errDiv.style.display = "block";
  errDiv.textContent = "No ?file= parameter given.";
}

let viewer = null;
let edgesOn = false;

// (Re)create the embedded viewer. Toggling edges or resetting the view is done
// through the public API only: destroy the old viewer and build a new one with
// the desired EdgeSettings; the default camera fit then frames the model again.
function createViewer() {
  if (viewer) {
    viewer.Destroy();
    viewer = null;
  }
  viewerDiv.innerHTML = "";
  viewer = new OV.EmbeddedViewer(viewerDiv, {
    backgroundColor: new OV.RGBAColor(248, 249, 250, 255),
    defaultColor: new OV.RGBColor(138, 144, 153),
    edgeSettings: new OV.EdgeSettings(edgesOn, new OV.RGBColor(52, 58, 64), 40),
    onModelLoaded: () => {
      btnEdges.disabled = false;
      btnReset.disabled = false;
      btnEdges.classList.toggle("active", edgesOn);
    },
    onModelLoadFailed: () => {
      errDiv.style.display = "block";
      errDiv.textContent = "Failed to load " + files.join(", ");
    }
  });
  viewer.LoadModelFromUrlList(files);
}

window.addEventListener("resize", () => {
  if (viewer) viewer.Resize();
});

btnEdges.addEventListener("click", () => {
  edgesOn = !edgesOn;
  createViewer();
});
btnReset.addEventListener("click", () => {
  // Recreating with the same settings restores the default fitted camera.
  createViewer();
});

if (files.length) {
  btnEdges.disabled = true;
  btnReset.disabled = true;
  createViewer();
}
</script>
</body>
</html>
