<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Part Viewer - OpenVVVF</title>
<link rel="icon" type="image/svg+xml" href="../../brand/icon.svg">
<style>
@font-face { font-family: "Saira"; src: url("../../brand/fonts/Saira-400.ttf") format("truetype"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Saira"; src: url("../../brand/fonts/Saira-700.ttf") format("truetype"); font-weight: 700; font-display: swap; }
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 20px;
  border-bottom: 1px solid #e9ecef; background: #fff; }
header img { height: 28px; }
header h1 { font-family: "Saira", sans-serif; font-size: 18px; margin: 0; }
header h1 .sep { color: #5a5a5a; font-weight: 400; margin: 0 6px; }
header .pn { color: #5a5a5a; font-size: 14px; }
#view { width: 100vw; height: calc(100vh - 54px); display: block; }
#err { padding: 40px; color: #c41e3a; display: none; }
</style>
</head>
<body>
<header>
  <a href="../../index.html"><img src="../../brand/logo.png" alt="OpenVVVF"></a>
  <h1><span class="sep">/</span>3D Part Viewer</h1>
  <span class="pn" id="pn"></span>
</header>
<canvas id="view"></canvas>
<div id="err"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const params = new URLSearchParams(location.search);
const file = params.get("file");
document.getElementById("pn").textContent = file ? file.split("/").pop().replace(/\.stl$/, "") : "";
if (!file) {
  document.getElementById("err").style.display = "block";
  document.getElementById("err").textContent = "No ?file= parameter given.";
} else {
  const canvas = document.getElementById("view");
  const renderer = new THREE.WebGLRenderer({canvas, antialias: true});
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf8f9fa);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 10000);
  const controls = new THREE.OrbitControls(camera, canvas);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.1));
  const dir = new THREE.DirectionalLight(0xffffff, 0.6);
  dir.position.set(1, 1, 1);
  scene.add(dir);

  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);

  new THREE.STLLoader().load(file, geometry => {
    geometry.computeBoundingBox();
    const bb = geometry.boundingBox;
    const center = bb.getCenter(new THREE.Vector3());
    geometry.translate(-center.x, -center.y, -center.z);
    const size = bb.getSize(new THREE.Vector3()).length();
    const mesh = new THREE.Mesh(geometry,
      new THREE.MeshStandardMaterial({color: 0x8a9099, metalness: 0.15, roughness: 0.75}));
    scene.add(mesh);
    camera.position.set(size * 0.6, size * 0.45, size * 0.7);
    controls.target.set(0, 0, 0);
    controls.update();
    resize();
  }, undefined, err => {
    document.getElementById("err").style.display = "block";
    document.getElementById("err").textContent = "Failed to load " + file;
  });

  (function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  })();
}
</script>
</body>
</html>
