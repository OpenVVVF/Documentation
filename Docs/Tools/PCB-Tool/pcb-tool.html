<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCB Tool - OpenVVVF</title>
<link rel="icon" type="image/svg+xml" href="../../brand/icon.svg">
<style>
@font-face { font-family: "Saira"; src: url("../../brand/fonts/Saira-400.ttf") format("truetype"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Saira"; src: url("../../brand/fonts/Saira-700.ttf") format("truetype"); font-weight: 700; font-display: swap; }
:root {
  --bg: #ffffff; --surface: #f8f9fa; --surface-2: #f1f3f5;
  --border: #d1d5db; --border-light: #e9ecef;
  --text: #1a1a1a; --text-muted: #5a5a5a;
  --accent: #fc0f27; --accent-dark: #c40d20;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-brand: "Saira", var(--font-body);
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font-body); color: var(--text); background: var(--bg); }
header {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px; border-bottom: 1px solid var(--border-light); background: var(--surface);
}
header img { height: 28px; }
header h1 { font-family: var(--font-brand); font-size: 20px; font-weight: 700; margin: 0; }
header h1 .sep { color: var(--text-muted); font-weight: 400; margin: 0 6px; }
.layout { display: flex; min-height: calc(100vh - 54px); }
aside {
  width: 300px; flex-shrink: 0; border-right: 1px solid var(--border-light);
  background: var(--surface); padding: 12px; overflow-y: auto;
}
aside input {
  width: 100%; padding: 8px 10px; margin-bottom: 10px;
  border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
}
.chassis { font-family: var(--font-brand); font-weight: 700; font-size: 12px;
  text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin: 14px 4px 6px; }
.pn {
  display: block; width: 100%; text-align: left; cursor: pointer;
  padding: 8px 10px; margin-bottom: 4px; border: 1px solid var(--border-light);
  border-radius: 6px; background: #fff; font-size: 13px;
}
.pn small { display: block; color: var(--text-muted); }
.pn:hover { border-color: var(--accent); }
.pn.active { border-color: var(--accent); background: #fff5f6; box-shadow: inset 3px 0 0 var(--accent); }
main { flex: 1; padding: 24px 28px; overflow-y: auto; }
main h2 { font-family: var(--font-brand); margin: 0 0 4px; }
.meta { color: var(--text-muted); font-size: 14px; margin-bottom: 18px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
.actions a, .actions button {
  display: inline-block; padding: 9px 16px; border-radius: 6px; font-size: 14px;
  text-decoration: none; border: 1px solid var(--border); color: var(--text);
  background: #fff; cursor: pointer; font-family: var(--font-body);
}
.actions a.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.actions a.primary:hover { background: var(--accent-dark); }
.actions a:hover, .actions button:hover { border-color: var(--accent); }
.renders { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; }
.renders figure { margin: 0; }
.renders img {
  max-width: 420px; width: 100%; border: 1px solid var(--border-light);
  border-radius: 8px; background: var(--surface-2);
}
.renders figcaption { font-size: 13px; color: var(--text-muted); margin-top: 6px; text-align: center; }
.ibom-wrap {
  border: 1px solid var(--border-light); border-radius: 8px; overflow: hidden;
  background: #fff;
}
.ibom-wrap:fullscreen { border-radius: 0; }
.ibom-wrap iframe { display: block; width: 100%; height: 70vh; border: 0; }
.ibom-wrap:fullscreen iframe { height: 100vh; }
.empty { color: var(--text-muted); margin-top: 40px; }
.fabspec {
  max-width: 720px; border: 1px solid var(--border-light); border-radius: 8px;
  background: var(--surface); padding: 4px 18px 12px; font-size: 14px;
}
@media (max-width: 800px) {
  .layout { flex-direction: column; }
  aside { width: 100%; border-right: none; border-bottom: 1px solid var(--border-light); }
}
</style>
</head>
<body>
<header>
  <a href="../../index.html"><img src="../../brand/logo.png" alt="OpenVVVF"></a>
  <h1><span class="sep">/</span>PCB Tool</h1>
</header>
<div class="layout">
  <aside>
    <input id="filter" type="search" placeholder="Filter part numbers..." oninput="renderList()">
    <div id="list"></div>
  </aside>
  <main id="main"><p class="empty">Select a PCB on the left.</p></main>
</div>
<script>
const MANIFEST = {"CHASSIS-C2-A": {"artifacts": {"price_estimate": {"qty": 1, "total": "2,285.68", "variant_vendors": {"generous": {"mcmaster": "189.18", "mouser": "2,004.01", "pcb": "129.08", "sendcutsend": "352.16"}, "standard": {"mcmaster": "178.51", "mouser": "1,780.08", "pcb": "64.54", "sendcutsend": "310.46"}}, "variants": {"base": "2,285.68", "generous": "2,674.42", "standard": "2,333.60"}, "vendors": {"In-House Assembly": "0.00", "McMaster-Carr": "163.63", "Mouser": "1,747.05", "PCB Fabrication": "64.54", "SendCutSend": "310.46"}}, "pricing_report": "Pricing_Report.md", "variants": {"generous": {"assembly": "BOMs/Variants/generous/assembly_bom.csv", "consolidated": "BOMs/Variants/generous/Consolidated_BOM.csv", "digikey": "BOMs/Variants/generous/digikey_bom.csv", "mcmaster": "BOMs/Variants/generous/mcmaster_bom.csv", "mcmaster_paste": "BOMs/Variants/generous/McMaster_Order_Paste.txt", "mouser": "BOMs/Variants/generous/mouser_bom.csv", "pcb": "BOMs/Variants/generous/pcb_bom.csv", "sendcutsend": "BOMs/Variants/generous/sendcutsend_bom.csv"}, "standard": {"assembly": "BOMs/Variants/standard/assembly_bom.csv", "consolidated": "BOMs/Variants/standard/Consolidated_BOM.csv", "digikey": "BOMs/Variants/standard/digikey_bom.csv", "mcmaster": "BOMs/Variants/standard/mcmaster_bom.csv", "mcmaster_paste": "BOMs/Variants/standard/McMaster_Order_Paste.txt", "mouser": "BOMs/Variants/standard/mouser_bom.csv", "pcb": "BOMs/Variants/standard/pcb_bom.csv", "sendcutsend": "BOMs/Variants/standard/sendcutsend_bom.csv"}}, "vendor_boms": {"assembly": "BOMs/assembly_bom.csv", "consolidated": "BOMs/Consolidated_BOM.csv", "mcmaster": "BOMs/mcmaster_bom.csv", "mcmaster_paste": "BOMs/McMaster_Order_Paste.txt", "mouser": "BOMs/mouser_bom.csv", "pcb": "BOMs/pcb_bom.csv", "sendcutsend": "BOMs/sendcutsend_bom.csv"}}, "chassis": "C2", "dir": "Data/Releases/C2/A", "generated": "2026-08-17T01:06:59+00:00", "rev": "A", "source_tag": "C2-A", "source_url": "https://github.com/datacrystals/InverterGen5/tree/C2-A"}, "HW-C2-PCB-CTRL-A": {"artifacts": {"bom_csv": "HW-C2-PCB-CTRL-A-bom.csv", "drc": "HW-C2-PCB-CTRL-A-drc.txt", "drc_violations": 0, "gerber_zip": "HW-C2-PCB-CTRL-A-gerbers.zip", "ibom": "ibom.html", "renders": ["ControlBoard-Back.png", "ControlBoard.png"], "schematic_pdf": "HW-C2-PCB-CTRL-A-schematic.pdf", "step": "HW-C2-PCB-CTRL-A.step"}, "board": "ControlBoard", "chassis": "C2", "dir": "Data/Releases/C2/A/ControlBoard", "generated": "2026-08-17T01:05:46+00:00", "part_number": "HW-C2-PCB-CTRL-A", "rev": "A", "source_tag": "C2-A", "source_url": "https://github.com/datacrystals/InverterGen5/tree/C2-A"}, "HW-C2-PCB-DCBUSCAP-A": {"artifacts": {"bom_csv": "HW-C2-PCB-DCBUSCAP-A-bom.csv", "drc": "HW-C2-PCB-DCBUSCAP-A-drc.txt", "drc_violations": 0, "gerber_zip": "HW-C2-PCB-DCBUSCAP-A-gerbers.zip", "ibom": "ibom.html", "renders": ["DCBusCapacitorBoard-Back.png", "DCBusCapacitorBoard-Front.png", "DCBusCapacitorBoard.png"], "schematic_pdf": "HW-C2-PCB-DCBUSCAP-A-schematic.pdf", "step": "HW-C2-PCB-DCBUSCAP-A.step"}, "board": "DCBusCapacitorBoard", "chassis": "C2", "dir": "Data/Releases/C2/A/DCBusCapacitorBoard", "generated": "2026-08-17T01:06:02+00:00", "part_number": "HW-C2-PCB-DCBUSCAP-A", "rev": "A", "source_tag": "C2-A", "source_url": "https://github.com/datacrystals/InverterGen5/tree/C2-A"}, "HW-C2-PCB-DCFLT-A": {"artifacts": {"bom_csv": "HW-C2-PCB-DCFLT-A-bom.csv", "drc": "HW-C2-PCB-DCFLT-A-drc.txt", "drc_violations": 0, "gerber_zip": "HW-C2-PCB-DCFLT-A-gerbers.zip", "ibom": "ibom.html", "renders": ["DCBusFilter-Back.png", "DCBusFilter-Back2.png", "DCBusFilter-Front.png", "DCBusFilter.png"], "schematic_pdf": "HW-C2-PCB-DCFLT-A-schematic.pdf", "step": "HW-C2-PCB-DCFLT-A.step"}, "board": "DCBusFilter", "chassis": "C2", "dir": "Data/Releases/C2/A/DCBusFilter", "generated": "2026-08-17T01:06:22+00:00", "part_number": "HW-C2-PCB-DCFLT-A", "rev": "A", "source_tag": "C2-A", "source_url": "https://github.com/datacrystals/InverterGen5/tree/C2-A"}, "HW-C2-PCB-GD-A": {"artifacts": {"bom_csv": "HW-C2-PCB-GD-A-bom.csv", "drc": "HW-C2-PCB-GD-A-drc.txt", "drc_violations": 0, "gerber_zip": "HW-C2-PCB-GD-A-gerbers.zip", "ibom": "ibom.html", "renders": ["GateDriver-Back.png", "GateDriver-Front.png", "GateDriver.png"], "schematic_pdf": "HW-C2-PCB-GD-A-schematic.pdf", "step": "HW-C2-PCB-GD-A.step"}, "board": "GateDriver", "chassis": "C2", "dir": "Data/Releases/C2/A/GateDriver", "generated": "2026-08-17T01:06:42+00:00", "part_number": "HW-C2-PCB-GD-A", "rev": "A", "source_tag": "C2-A", "source_url": "https://github.com/datacrystals/InverterGen5/tree/C2-A"}, "HW-C2-PCB-IO-A": {"artifacts": {"bom_csv": "HW-C2-PCB-IO-A-bom.csv", "drc": "HW-C2-PCB-IO-A-drc.txt", "drc_violations": 0, "gerber_zip": "HW-C2-PCB-IO-A-gerbers.zip", "ibom": "ibom.html", "renders": ["IOBoard-Back.png", "IOBoard-Front.png", "IOBoard.png"], "schematic_pdf": "HW-C2-PCB-IO-A-schematic.pdf", "step": "HW-C2-PCB-IO-A.step"}, "board": "IOBoard", "chassis": "C2", "dir": "Data/Releases/C2/A/IOBoard", "generated": "2026-08-17T01:06:59+00:00", "part_number": "HW-C2-PCB-IO-A", "rev": "A", "source_tag": "C2-A", "source_url": "https://github.com/datacrystals/InverterGen5/tree/C2-A"}};
const ROOT = "../../";

const ARTIFACTS = [
  ["schematic_pdf", "Schematic PDF", true],
  ["bom_csv", "BOM (CSV)", true],
  ["gerber_zip", "Gerbers (ZIP)", true],
  ["drc", "DRC Report", true],
  ["step", "STEP Model", false],
];

function entries() {
  return Object.values(MANIFEST).filter(e => e.board)
           .sort((a, b) => a.part_number.localeCompare(b.part_number));
}

function renderList() {
  const q = document.getElementById("filter").value.trim().toLowerCase();
  const list = document.getElementById("list");
  list.innerHTML = "";
  let lastChassis = null;
  for (const e of entries()) {
    if (q && !e.part_number.toLowerCase().includes(q) && !e.board.toLowerCase().includes(q)) continue;
    if (e.chassis !== lastChassis) {
      const h = document.createElement("div");
      h.className = "chassis";
      h.textContent = "Chassis " + e.chassis;
      list.appendChild(h);
      lastChassis = e.chassis;
    }
    const b = document.createElement("button");
    b.className = "pn" + (location.hash === "#" + e.part_number ? " active" : "");
    b.innerHTML = e.part_number + "<small>" + e.board + "</small>";
    b.onclick = () => { location.hash = e.part_number; };
    list.appendChild(b);
  }
}

function renderCaption(filename, board) {
  const m = filename.replace(/\.png$/, "").slice(board.length);
  if (m === "" || m === "-Front") return "Front";
  if (m === "-Back") return "Back";
  return m.replace(/^-/, "").replace(/-/g, " ");
}

function renderSortKey(filename, board) {
  const c = renderCaption(filename, board);
  return c === "Front" ? 0 : c === "Back" ? 1 : 2;
}

function renderMain() {
  const pn = location.hash.slice(1);
  const e = MANIFEST[pn];
  const main = document.getElementById("main");
  if (!e) { main.innerHTML = '<p class="empty">Select a PCB on the left.</p>'; renderList(); return; }
  const base = ROOT + e.dir + "/";
  const a = e.artifacts || {};
  let html = "<h2>" + e.part_number + "</h2>";
  html += '<div class="meta">' + e.board + " · Chassis " + e.chassis +
          " · Rev " + e.rev + " · source tag <code>" + e.source_tag + "</code></div>";
  html += '<div class="actions">';
  if (a.ibom)
    html += '<a class="primary" href="' + base + a.ibom + '" target="_blank" rel="noopener">Open Interactive Assembly \u2197</a>';
  if (a.ibom)
    html += "<button onclick=\"document.getElementById('ibom-wrap').requestFullscreen()\">Fullscreen</button>";
  if (e.source_url)
    html += '<a href="' + e.source_url + '" target="_blank" rel="noopener">Open Source (' + e.source_tag + ') \u2197</a>';
  for (const [key, label, newTab] of ARTIFACTS) {
    if (!a[key]) continue;
    html += '<a href="' + base + a[key] + '"' +
            (newTab ? ' target="_blank" rel="noopener"' : ' download') + '>' + label + "</a>";
  }
  html += "</div>";
  if (a.renders && a.renders.length) {
    const sorted = a.renders.slice().sort((x, y) => renderSortKey(x, e.board) - renderSortKey(y, e.board));
    html += '<div class="renders">';
    for (const r of sorted) {
      const cap = renderCaption(r, e.board);
      html += '<figure><a href="' + base + r + '" target="_blank" rel="noopener"><img src="' + base + r + '" alt="' + cap + '"></a>' +
              "<figcaption>" + cap + "</figcaption></figure>";
    }
    html += "</div>";
  }
  if (a.ibom)
    html += '<div class="ibom-wrap" id="ibom-wrap"><iframe src="' + base + a.ibom + '" title="Interactive assembly"></iframe></div>';
  if (a.fab_spec)
    html += '<h3 style="margin-top:24px">Ordering specifications</h3><div class="fabspec" id="fabspec">Loading...</div>';
  main.innerHTML = html;
  if (a.fab_spec)
    fetch(base + a.fab_spec).then(r => r.text()).then(md => {
      document.getElementById("fabspec").innerHTML = mdLite(md);
    });
  renderList();
}

function mdLite(md) {
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
                            .replace(/`(.+?)`/g, "<code>$1</code>");
  let html = "", inList = false;
  for (const line of md.split("\n")) {
    const t = line.trim();
    const closeList = () => { if (inList) { html += "</ul>"; inList = false; } };
    if (t.startsWith("## ")) { closeList(); html += "<h4>" + inline(t.slice(3)) + "</h4>"; }
    else if (t.startsWith("# ")) { closeList(); html += "<h4>" + inline(t.slice(2)) + "</h4>"; }
    else if (t.startsWith("- ")) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += "<li>" + inline(t.slice(2)) + "</li>";
    }
    else if (t === "") closeList();
    else { closeList(); html += "<p>" + inline(t) + "</p>"; }
  }
  if (inList) html += "</ul>";
  return html;
}

window.addEventListener("hashchange", renderMain);
renderMain();
</script>
</body>
</html>
