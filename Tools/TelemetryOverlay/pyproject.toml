[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vvvf-overlay"
version = "0.1.0"
description = "OpenVVVF branded telemetry video overlays (session JSONL -> F1 dash composite)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
vvvf-overlay = "telemetry_overlay.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["telemetry_overlay*"]

[tool.setuptools.package-data]
telemetry_overlay = [
    "assets/*.png",
    "assets/fonts/*.ttf",
    "assets/sponsors/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
