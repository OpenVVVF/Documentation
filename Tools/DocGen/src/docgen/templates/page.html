<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{title} - OpenVVVF Documentation</title>
  <link rel="stylesheet" href="{root}style.css?v=4">
  <link rel="stylesheet" href="{root}print.css?v=4" media="print">
  <style media="print">
    @page {{
      @top-left {{
        content: "{header_title}";
      }}
      @top-right {{
        content: "{header_id}";
      }}
    }}
    @page :first {{
      @top-left {{ content: none; }}
      @top-right {{ content: none; }}
    }}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <button class="mobile-menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="sidebar">
        <svg class="mobile-menu-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="mobile-menu-label">Menu</span>
      </button>
      <a href="{root}index.html" class="site-title">OpenVVVF<span class="site-title-sep">/</span><span class="site-title-docs">docs</span></a>
      <nav class="site-nav" aria-label="Top sections">
        <a href="{root}Hardware/index.html">Hardware</a>
        <a href="{root}Safety-and-Compliance/index.html">Safety & Compliance</a>
        <a href="{root}Software/index.html">Software</a>
        <a href="{root}Tools/index.html">Tools</a>
      </nav>
      <a class="pdf-download-button" id="pdf-download-button" href="{pdf_url}" title="Download PDF" style="display:none;">PDF</a>
      <button class="print-button" type="button" onclick="window.print()" title="Print this page">Print</button>
    </div>
  </header>

  <div class="sidebar-reveal" id="sidebar-reveal">
    <button class="sidebar-toggle" type="button" aria-label="Show sidebar" aria-expanded="false" title="Show sidebar">
      <span class="sidebar-toggle-icon" aria-hidden="true">»</span>
      <span class="sidebar-toggle-label">Contents</span>
    </button>
  </div>

  <div class="mobile-nav-backdrop" id="mobile-nav-backdrop" aria-hidden="true"></div>

  {cover}

  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar" aria-label="Table of contents">
      <button class="sidebar-close" type="button" aria-label="Close navigation menu">
        <span aria-hidden="true">×</span>
      </button>
      <button class="sidebar-toggle" type="button" aria-label="Collapse sidebar" aria-expanded="true" title="Collapse sidebar">
        <span class="sidebar-toggle-icon" aria-hidden="true">«</span>
        <span class="sidebar-toggle-label">Collapse</span>
      </button>
      <nav class="site-nav-mobile" aria-label="Top sections">
        <ul>
          <li><a href="{root}Hardware/index.html">Hardware</a></li>
          <li><a href="{root}Safety-and-Compliance/index.html">Safety & Compliance</a></li>
          <li><a href="{root}Software/index.html">Software</a></li>
          <li><a href="{root}Tools/index.html">Tools</a></li>
        </ul>
      </nav>
      {nav}
    </aside>

    <main>
      <div class="breadcrumbs">{breadcrumbs}</div>
      <article class="content {content_class}">
        {frontmatter}
        {body}
      </article>
    </main>
  </div>

  <footer class="footer">
    OpenVVVF Documentation - generated by docgen
  </footer>

  <script>
    (function () {{
      var sidebar = document.getElementById('sidebar');
      var reveal = document.getElementById('sidebar-reveal');
      var collapseBtn = sidebar.querySelector('.sidebar-toggle');
      var showBtn = reveal.querySelector('.sidebar-toggle');
      var mobileToggle = document.querySelector('.mobile-menu-toggle');
      var mobileClose = sidebar.querySelector('.sidebar-close');
      var backdrop = document.getElementById('mobile-nav-backdrop');

      function setCollapsed(collapsed) {{
        document.body.classList.toggle('sidebar-collapsed', collapsed);
        collapseBtn.setAttribute('aria-expanded', String(!collapsed));
        showBtn.setAttribute('aria-expanded', String(collapsed));
        try {{ localStorage.setItem('ovvf-sidebar-collapsed', String(collapsed)); }} catch (e) {{}}
      }}

      if (collapseBtn) {{
        collapseBtn.addEventListener('click', function () {{ setCollapsed(true); }});
      }}
      if (showBtn) {{
        showBtn.addEventListener('click', function () {{ setCollapsed(false); }});
      }}

      function initCollapsed() {{
        try {{
          var stored = localStorage.getItem('ovvf-sidebar-collapsed');
          if (stored !== null) {{
            setCollapsed(stored === 'true');
            return;
          }}
        }} catch (e) {{}}
        if (window.innerWidth > 900) {{
          setCollapsed(false);
        }} else {{
          setCollapsed(true);
        }}
      }}
      initCollapsed();

      // Mobile drawer state (separate from desktop collapse state)
      function setMobileOpen(open) {{
        document.body.classList.toggle('mobile-nav-open', open);
        if (mobileToggle) {{
          mobileToggle.setAttribute('aria-expanded', String(open));
        }}
        if (backdrop) {{
          backdrop.setAttribute('aria-hidden', String(!open));
        }}
        if (open) {{
          document.documentElement.classList.add('mobile-nav-open');
        }} else {{
          document.documentElement.classList.remove('mobile-nav-open');
        }}
      }}

      if (mobileToggle) {{
        mobileToggle.addEventListener('click', function () {{
          setMobileOpen(!document.body.classList.contains('mobile-nav-open'));
        }});
      }}
      if (mobileClose) {{
        mobileClose.addEventListener('click', function () {{ setMobileOpen(false); }});
      }}
      if (backdrop) {{
        backdrop.addEventListener('click', function () {{ setMobileOpen(false); }});
      }}

      document.addEventListener('keydown', function (e) {{
        if (e.key === 'Escape' && document.body.classList.contains('mobile-nav-open')) {{
          setMobileOpen(false);
        }}
      }});

      // Show PDF download button only if the PDF file actually exists
      (function () {{
        var pdfLink = document.getElementById('pdf-download-button');
        if (!pdfLink || !pdfLink.href) return;
        try {{
          var req = new XMLHttpRequest();
          req.open('HEAD', pdfLink.href, true);
          req.onreadystatechange = function () {{
            if (req.readyState === 4 && req.status === 200) {{
              pdfLink.style.display = 'inline-flex';
            }}
          }};
          req.send();
        }} catch (e) {{}}
      }})();

      // Accordion toggles for nav sections
      document.querySelectorAll('.nav-section-toggle').forEach(function (btn) {{
        btn.addEventListener('click', function (e) {{
          e.preventDefault();
          var li = btn.closest('.nav-section');
          var collapsed = li.classList.toggle('nav-section-collapsed');
          btn.setAttribute('aria-expanded', String(!collapsed));
        }});
      }});

      // Menu-only section labels are also clickable to expand/collapse
      document.querySelectorAll('.nav-section > .group-label').forEach(function (label) {{
        label.addEventListener('click', function () {{
          var btn = label.parentElement.querySelector('.nav-section-toggle');
          if (btn) btn.click();
        }});
      }});
    }})();
  </script>

  <script>
    window.MathJax = {{
      tex: {{
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
      }},
      svg: {{ fontCache: 'global' }}
    }};
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</body>
</html>
