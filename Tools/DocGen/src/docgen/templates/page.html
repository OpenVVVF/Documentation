<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{title} - OpenVVVF Documentation</title>
  <link rel="stylesheet" href="{root}style.css">
  <link rel="stylesheet" href="{root}print.css" media="print">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="{root}index.html" class="site-title">OpenVVVF<span class="site-title-docs">Docs</span></a>
      <nav class="site-nav" aria-label="Top sections">
        <a href="{root}Control-Assembly/index.html">Control Assembly</a>
        <a href="{root}Power-Stages/index.html">Power Stages</a>
        <a href="{root}Safety-and-Compliance/index.html">Safety and Compliance</a>
        <a href="{root}Software/index.html">Software</a>
        <a href="{root}Testing/index.html">Testing</a>
      </nav>
      <button class="sidebar-toggle" type="button" aria-label="Toggle sidebar" aria-expanded="true" title="Toggle sidebar">☰</button>
      <button class="print-button" type="button" onclick="window.print()" title="Print this page">Print</button>
    </div>
  </header>

  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar" aria-label="Table of contents">
      {nav}
    </aside>

    <main>
      <div class="breadcrumbs">{breadcrumbs}</div>
      <article class="content {content_class}">
        {frontmatter}
        {body}
      </article>
    </main>
  </div>

  <footer class="footer">
    OpenVVVF Documentation - generated by docgen
  </footer>

  <script>
    (function () {{
      var layout = document.getElementById('layout');
      var toggle = document.querySelector('.sidebar-toggle');
      if (toggle && layout) {{
        toggle.addEventListener('click', function () {{
          var collapsed = layout.classList.toggle('sidebar-collapsed');
          toggle.setAttribute('aria-expanded', String(!collapsed));
          try {{ localStorage.setItem('ovvf-sidebar-collapsed', String(collapsed)); }} catch (e) {{}}
        }});
        try {{
          if (localStorage.getItem('ovvf-sidebar-collapsed') === 'true') {{
            layout.classList.add('sidebar-collapsed');
            toggle.setAttribute('aria-expanded', 'false');
          }}
        }} catch (e) {{}}
      }}
    }})();
  </script>

  <script>
    window.MathJax = {{
      tex: {{
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
      }},
      svg: {{ fontCache: 'global' }}
    }};
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</body>
</html>
