name: Build and deploy documentation site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docgen
        run: pip install -e Tools/DocGen

      - name: Validate cross-references
        run: python -m docgen validate

      - name: Build static site
        run: python -m docgen site --output-dir site

      - name: Install Chromium for PDF generation
        # GitHub-hosted Ubuntu runners ship a browser already; only install when
        # nothing usable is on PATH. On 24.04+ apt's chromium-browser is a
        # snap-transitional package, so fall back to chromium and vice versa.
        run: |
          if command -v chromium >/dev/null || command -v chromium-browser >/dev/null || command -v google-chrome >/dev/null; then
            echo "Chromium already available, skipping install"
          else
            sudo apt-get update
            sudo apt-get install -y chromium || sudo apt-get install -y chromium-browser
          fi

      - name: Generate PDFs
        run: python -m docgen pdf --all --site-dir site --output-dir site/pdfs

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          pip install -e Tools/BOMManager -e Tools/DocGen -e Tools/HWRelease pytest

      - name: Run tool tests
        run: python -m pytest Tools/BOMManager/tests Tools/DocGen/tests Tools/HWRelease/tests -q

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
